name: scp to paul
on: [push]
jobs:
  # Tier-1 unit suite (hermetic, offline fixtures). Gates deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Repo
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: install deps
        run: deno install
      - name: run unit tests
        run: deno task test

  # ESLint (flat config). Gates deploy.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Repo
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: install deps
        run: deno install
      - name: run eslint
        run: deno task lint

  # TypeScript typecheck (tsc --noEmit; the Vite build strips types without
  # checking, so this is the only type gate). Gates deploy.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Repo
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: install deps
        run: deno install
      - name: run typecheck
        run: deno task check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Repo
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: install && build
        run: deno install && deno task build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          # Carry dotfiles (dist/.htaccess sets the application/ld+json type for
          # the Solid client-id document); v7 excludes hidden files by default.
          include-hidden-files: true
  deploy:
    # Gate: only deploy if build, unit tests, lint, and typecheck all pass,
    # and only from the dev-aha branch (CI still runs on every branch).
    needs: [build, test, lint, check]
    if: github.ref == 'refs/heads/dev-aha'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Repo
        uses: actions/checkout@v4
      - name: download build files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "dist"
          target: "public_html/testing/granergize/"
          rm: true
          strip_components: 1
